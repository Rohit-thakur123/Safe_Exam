services:
  compiler-service:
    build:
      context: ./compiler-service
      dockerfile: Dockerfile
    ports:
      - '5001:5001'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5001
      - COMPILER_SERVICE_KEY=${COMPILER_SERVICE_KEY:-safeexam-internal-compiler-key}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./compiler-service/temp:/app/temp
    networks:
      - compiler-network

networks:
  compiler-network:
    driver: bridge
